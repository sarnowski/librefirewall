[workspace]
resolver = "3"
members = [
    "crates/wire",
    "crates/queue",
    "crates/packet-buffer",
    "crates/net-headers",
    "crates/routing",
    "crates/ip-endpoint",
    "crates/log",
    "crates/virtio",
    "crates/pd-runtime",
    "crates/nic-driver-core",
    "crates/uart-16550",
    "crates/config",
    "crates/clock",
    "crates/hpet",
    "crates/rtc",
    "crates/tcp",
    "pds/nic-driver",
    "pds/forwarder",
    "pds/config",
    "pds/console",
    "pds/clock",
    "pds/management",
    "tools/xtask",
]
default-members = ["tools/xtask"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
sel4-microkit = { path = "/opt/rust-sel4/crates/sel4-microkit" }
# The raw seL4 API, for the one thing `sel4-microkit` does not wrap: invoking an
# x86 I/O-port capability (`pds/console/src/com1.rs`). Same pinned tree as
# `sel4-microkit`, which already depends on it, so this adds no input to pin —
# only a name to reach it by.
sel4 = { path = "/opt/rust-sel4/crates/sel4" }
# Property-testing framework, dev-dependency only (host test builds are `std`;
# it never enters a `no_std`/PD build). Pinned here and resolved exactly through
# Cargo.lock so the offline builder can fetch it.
proptest = "1.11.0"
# Microbenchmark harness, dev-dependency only (benches build with `std` on the
# host and never enter a `no_std`/PD build). Pinned here and resolved exactly
# through Cargo.lock so the offline builder can fetch it.
criterion = "0.7.0"

# Lints applied to every workspace member via `[lints] workspace = true`. Only
# lints that already pass everywhere belong here; the gate denies all warnings.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `missing_docs` is deliberately absent (AGENTS.md DOC-4). Forcing a comment
# onto every public item manufactures contentless prose — a lint that makes
# documentation *exist* without making it *true* buys nothing, and every
# sentence it compels is an untested assertion that nothing fails when it goes
# stale. What replaces it is the DOC-11 ratchet in `tools/xtask/src/budgets.rs`,
# which lets a file's comment ratio fall and never rise, and the two `unsafe`
# obligations that have no other carrier and so stay denied above and below:
# `unsafe_op_in_unsafe_fn` and `undocumented_unsafe_blocks`.

[workspace.lints.clippy]
# Every `unsafe` block carries a truthful `// SAFETY:` comment stating the
# invariant that makes it sound (AGENTS.md rule). Denied here so a bare block
# fails the build instead of relying on review to catch it.
undocumented_unsafe_blocks = "deny"

# The one profile the protection domains are ever compiled with: `xtask image`
# passes `--release` in both the `debug` and the `release` seL4 kernel
# configuration, because the PDs are the dataplane and a forwarding test is only
# meaningful against optimized code. That is deliberate, and it has a
# consequence worth stating where it would otherwise be rediscovered the hard
# way: `debug-assertions` is off here, so a `debug_assert!` anywhere in the
# workspace is absent from every image that ever boots, including the one the
# QEMU system tests exercise. No check may therefore be conditional on it
# (AGENTS.md ENG-10); the shipped profile is the tested profile (BLD-3).
#
# `panic = "abort"` is load-bearing rather than a size tweak: the PDs are
# `no_std` binaries and there is no unwinder under seL4.
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
# On, so the artifact that ships is the one the property tests prove. Those
# tests assert "arbitrary input never panics" while running with overflow
# checking; leaving it off here shipped a binary that wraps silently instead,
# and a wrap on a dataplane index is precisely the reachable-from-input
# arithmetic ENG-5 forbids. The arithmetic on those paths is bounded by
# construction, so this is expected to change no behaviour — and where that
# expectation is ever wrong, a `panic = "abort"` PD faulting loudly is the
# outcome ENG-12 asks for over a silently wrapped index.
overflow-checks = true
