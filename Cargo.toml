[workspace]
resolver = "3"
members = [
    "crates/wire",
    "crates/queue",
    "crates/packet-buffer",
    "crates/virtio",
    "crates/pd-runtime",
    "pds/nic-driver",
    "pds/forwarder",
    "tools/xtask",
]
default-members = ["tools/xtask"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
sel4-microkit = { path = "/opt/rust-sel4/crates/sel4-microkit" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
