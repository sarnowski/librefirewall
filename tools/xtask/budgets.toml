# Recorded comment and `unsafe` budgets — the DOC-11 and ENG-13 ratchets.
#
# Generated by `tools/xtask/src/budgets.rs`; do not hand-edit. Every number here may
# fall and may never rise: the gate (`xtask test`) fails on any increase. Re-record
# after a deliberate, approved (SCM-6) reduction with
#
#     LIBREFIREWALL_BUDGETS_UPDATE=1 cargo test -p xtask update_the_recorded_budgets
#
# [comment-ratio] is comment lines / production lines per production file. A comment
# line is one whose first non-whitespace byte opens or continues a comment; production
# lines are every line outside a `#[cfg(test)]` item, blank lines included. Benches,
# integration tests and files backing a `#[cfg(test)] mod NAME;` are not production.
#
# [unsafe-*] are per-crate counts of production `unsafe { … }` blocks, `unsafe fn`
# declarations and `unsafe impl` items. A crate with none is recorded as 0, so its
# first `unsafe` fails the gate.

