[package]
# `log` is taken by a well-known crate; the directory keeps the short name and
# the package carries the project prefix, so the lib target is `lfw_log`.
name = "lfw-log"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
net-headers = { path = "../net-headers" }
# The shared-memory record and ring an event crosses a domain boundary as. The
# dependency runs this way and never back: `wire` lays out regions and depends
# on nothing, and turning a region's bytes into an event is this crate's.
wire = { path = "../wire" }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
