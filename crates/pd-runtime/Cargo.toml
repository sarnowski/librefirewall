[package]
name = "pd-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wire = { path = "../wire" }
queue = { path = "../queue" }
packet-buffer = { path = "../packet-buffer" }
net-headers = { path = "../net-headers" }
routing = { path = "../routing" }
lfw-ip-endpoint = { path = "../ip-endpoint" }
# The arithmetic that turns a counter reading into an instant: what the
# transport's timers are stated against, and what `clock.rs` stamps every log
# record with.
lfw-clock = { path = "../clock" }
lfw-log = { path = "../log" }
# The shards this domain and its neighbours publish into, and the exposition the
# management endpoint answers a scrape with. The conversions from this crate's
# counters into that crate's samples live here (`stats`), because this is where
# both halves are visible.
lfw-metrics = { path = "../metrics" }

[dev-dependencies]
proptest = { workspace = true }
# The status vocabulary the metric catalogue counts responses under, held to
# `lfw_http::Status::ALL` by a test in `stats` — the crate that owns neither
# alone.
lfw-http = { path = "../http" }
lfw-tcp = { path = "../tcp" }
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "route"
harness = false
