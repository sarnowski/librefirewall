# OCI image and Debian package snapshot. The base image carries Erlang/OTP,
# Elixir and Debian bookworm; the snapshot freezes the archive that every apt
# package — and every transitive dependency of one — resolves against, and its
# date matches the one the base image itself was built from. The exact version
# of each package we ask for is pinned inline in build/container/Containerfile,
# where it sits next to the package name. ELIXIR_VERSION names the builder
# image tag; the digest pins the content.
ELIXIR_VERSION=1.18.4
ELIXIR_IMAGE=docker.io/hexpm/elixir:1.18.4-erlang-27.3.4-debian-bookworm-20250520@sha256:07bc7c136f74e2bc04c499394f66b50d30eee0bc77a0bb416293ee035afca8ea
CTRLD_DEBIAN_SNAPSHOT=20250520T000000Z

# Hex, rebar3, and the Phoenix project generator, installed into MIX_HOME
# inside the image so the toolchain is read-only at run time. rebar3 is the
# published escript, sha256-pinned. HEX_VERSION and PHX_NEW_VERSION carry a
# version but no sha256 because `mix local.hex` and `mix archive.install hex`
# offer no way to supply one; the version is exact and Hex verifies the
# download against the checksum in the registry it fetched over TLS. Residual
# risk: that checksum comes from the registry rather than from a value
# recorded here — the same standing the datad lock records for its
# cargo-installed tools. Neither enters a deployed artifact.
HEX_VERSION=2.5.1
PHX_NEW_VERSION=1.8.9
REBAR3_VERSION=3.24.0
REBAR3_URL=https://github.com/erlang/rebar3/releases/download/3.24.0/rebar3
REBAR3_SHA256=d2d31cfb98904b8e4917300a75f870de12cb5167cd6214d1043e973a56668a54

# Standalone asset compilers, baked into the image at /opt/assets so the
# offline gate and the development server never download them. The versions
# MUST match what config/config.exs names — ctrld-provision-assets asks the
# project which version it wants and refuses when the image does not carry
# it, so a drift is a loud failure rather than a quiet download.
TAILWIND_VERSION=4.3.0
TAILWIND_URL=https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.0/tailwindcss-linux-x64
TAILWIND_SHA256=73f0e5459054e5cfaa8ab6f3b940f3fbe0f13cc7fd83bc24e7c655033c203400
ESBUILD_VERSION=0.25.4
ESBUILD_URL=https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.25.4.tgz
ESBUILD_SHA256=387f77dd2ed4f66ab2b02150943554c6131431a7df36a62191112ec21453f009

# The two databases, pinned by digest. They are not baked into the builder
# image — they are sibling containers the gate and the development stack bring
# up — so `make ctrld-image` pulls them during its network phase and every
# later target requires them to be present already, exactly as it requires the
# builder itself. compose.yaml reads these same two lines as its env file, so
# the development stack and the gate cannot drift onto different databases.
POSTGRES_IMAGE=docker.io/library/postgres@sha256:45cd22f8d32e189d245403954882f88e7a8714301fda80dab6da90f1265b25a3
CLICKHOUSE_IMAGE=docker.io/clickhouse/clickhouse-server@sha256:a9d328123ff8a61bf6b16448528b577d59deb85758172e13b09054b0727f8adf
