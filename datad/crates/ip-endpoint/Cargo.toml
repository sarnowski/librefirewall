[package]
name = "lfw-ip-endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
net-headers = { path = "../net-headers" }
# The transport this endpoint terminates a connection with, and the clock every
# one of its timers is stated against.
lfw-tcp = { path = "../tcp" }
lfw-clock = { path = "../clock" }
# The request head parser and the response head builder the management server is
# written against. It owns no buffer and knows nothing about `/metrics`; what a
# target means is decided here.
lfw-http = { path = "../http" }
# `MAX_EXPOSITION_LEN` alone, which is what sizes the response staging buffer.
# Deriving that bound rather than choosing a number is what stops a metric added
# later truncating an operator's scrape; nothing else of the crate is used, and
# the exposition itself arrives through the `http::Exposition` trait.
lfw-metrics = { path = "../metrics" }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
