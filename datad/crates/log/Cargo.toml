[package]
# `log` is taken by a well-known crate; the directory keeps the short name and
# the package carries the project prefix, so the lib target is `lfw_log`.
name = "lfw-log"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
net-headers = { path = "../net-headers" }
# The instant every record carries and the calendar that renders it: `Stamp`
# holds a `UtcNanos` and the console line is RFC 3339, and the leap rule belongs
# to the crate that owns time arithmetic rather than being restated beside a
# console grammar. The dependency runs this way and never back — `lfw-clock`
# reaches for nothing — which is what keeps a refusal raised there from being
# namable here.
lfw-clock = { path = "../clock" }
# The shared-memory record and ring an event crosses a domain boundary as. The
# dependency runs this way and never back: `wire` lays out regions and depends
# on nothing, and turning a region's bytes into an event is this crate's.
wire = { path = "../wire" }
# The shard the console domain publishes into. `ConsoleCounters::to_sample` is
# here because this crate owns one half of that shard and the protection domain
# holds the other; `lfw-metrics` depends on neither.
lfw-metrics = { path = "../metrics" }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
