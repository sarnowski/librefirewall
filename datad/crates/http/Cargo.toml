[package]
# `http` is a common crate name; the directory keeps the short name and the
# package carries the project prefix, so the lib target is `lfw_http` — the same
# split `crates/clock`, `crates/log`, `crates/tcp` and `crates/metrics` make.
name = "lfw-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
