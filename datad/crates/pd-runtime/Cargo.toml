[package]
name = "pd-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wire = { path = "../wire" }
queue = { path = "../queue" }
packet-buffer = { path = "../packet-buffer" }
net-headers = { path = "../net-headers" }
routing = { path = "../routing" }
# The verdict chain the routing stage drives, and the refusal vocabulary every
# counter and every tap annotation here is keyed by.
pipeline = { path = "../pipeline" }
# The connection table the forwarding domain places in a region of its own: this
# crate states how large that region must be and hands the domain its exclusive
# borrow of it.
lfw-flow = { path = "../flow" }
lfw-ip-endpoint = { path = "../ip-endpoint" }
# The arithmetic that turns a counter reading into an instant: what the
# transport's timers are stated against, and what `clock.rs` stamps every log
# record with.
lfw-clock = { path = "../clock" }
lfw-log = { path = "../log" }
# The shards this domain and its neighbours publish into, and the reading the
# management domain composes out of them. The conversions from this crate's
# counters into that crate's samples live here (`stats`), because this is where
# both halves are visible.
lfw-metrics = { path = "../metrics" }
# The block driver's own fault counters, whose conversion into the recorder's
# shard lives here for the reason every other conversion does: `lfw_metrics`
# depends on neither side, and a conversion in `lfw_blk` would put the metric
# vocabulary inside a device-class layer whose dependency set is `virtio` alone.
lfw-blk = { path = "../blk" }
# The recording pass's counters, whose conversion into the recorder's shard
# lives here for the same reason every other conversion does.
lfw-recorder = { path = "../recorder" }

[dev-dependencies]
proptest = { workspace = true }
# The status vocabulary the metric catalogue counts responses under, held to
# `lfw_http::Status::ALL` by a test in `stats` — the crate that owns neither
# alone.
lfw-http = { path = "../http" }
lfw-tcp = { path = "../tcp" }
# The types a configuration commit's call frame holds, for the test that keeps
# `pds/config`'s declared stack ahead of them. A dev dependency and not a real
# one: nothing in this crate reads a document.
config = { path = "../config" }
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "route"
harness = false
