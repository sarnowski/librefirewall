[package]
# The rustls crypto provider and the session driver over it. `lfw-tls` rather
# than `tls`, on the same split `crates/log` makes.
name = "lfw-tls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lfw-crypto = { path = "../crypto" }
lfw-x509 = { path = "../x509" }
# The console vocabulary an onboarding handshake's outcome is reported in. It is
# here rather than in the protection domain that emits the records because the
# mapping is from the adopted library's two error vocabularies, which only this
# crate sees — and putting it here is what makes it host-testable arm by arm.
# The dependency runs this way and never back: `lfw-log` reaches for no TLS.
lfw-log = { path = "../log" }
# The onboarding package's injected chain check. It is here because this crate
# holds the appliance's one general X.509 policy engine — the adopted
# validator — and the package reader deliberately holds none: what crosses is
# the trait and a yes or a no, so the reader gains no certificate parser and
# this crate gains no rule about what a package is. The dependency runs this way
# and never back.
lfw-package = { path = "../package" }
# TLS itself. `default-features = false` drops `std`, the aws-lc-rs provider
# and its C toolchain, TLS 1.2, and the logging facade; `custom-provider` is
# how rustls is told that the provider comes from here and that no process-wide
# default is to be consulted. `alloc` is not a feature — rustls requires it
# unconditionally, which is the whole reason this crate's consumer carries an
# arena.
rustls = { version = "0.23.43", default-features = false, features = [
    "custom-provider",
] }

[dev-dependencies]
proptest = { workspace = true }
# **A test dependency and never a production one.** This crate terminates the
# record layer and deliberately knows nothing about the protocol above it; what
# the one test using this proves is that the two compose the way the protection
# domain wires them, which is a claim neither crate can make alone. The
# production dependency runs the other way and stays absent.
lfw-onboarding = { path = "../onboarding" }

[lints]
workspace = true
