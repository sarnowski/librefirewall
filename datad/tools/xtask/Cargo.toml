[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

# The crates whose constants the Microkit system description must agree with,
# depended on so `sysdesc` compares the real values rather than a copy of them:
# a checker that restates a constant recreates exactly the drift it exists to
# close. All are `no_std` and none reaches for seL4, so they build for the host
# unchanged. These are the whole of xtask's dependency set — it carries no
# third-party crate, so the bootstrap tooling stays auditable and builds
# offline inside the pinned container.
[dependencies]
pd-runtime = { path = "../../crates/pd-runtime" }
nic-driver-core = { path = "../../crates/nic-driver-core" }
# Reached for `pci::PCI_CONFIG_LEN` alone. `nic-driver-core` already pulls it
# in transitively, but a transitive dependency is not a name this crate may
# use, and the alternative — writing 4096 into sysdesc.rs — is the drift above.
virtio = { path = "../../crates/virtio" }
# The configuration handover region sizes, for the same reason as every
# constant above it.
wire = { path = "../../crates/wire" }
# The one dependency here that is a judgement rather than a constant: `image`
# runs `config::load` over the document `pds/config` is about to embed, so the
# build refuses exactly what the appliance would refuse. Re-implementing that
# judgement in xtask would be a second validator to keep in step with the first,
# which is the drift above wearing a larger coat.
config = { path = "../../crates/config" }
# The console grammar itself. `config_transcript` renders the records a boot
# must produce with the very renderer the protection domains print through, so
# the expectation and the appliance cannot come to describe one commit in two
# different languages — the drift above, in the one place a test would hide it.
lfw-log = { path = "../../crates/log" }
# The COM1 window, for the same reason as every constant above it: the
# `<ioport>` grant and the addresses the driver forms inside it are two
# statements of one fact, and `sysdesc` is where they are compared.
uart-16550 = { path = "../../crates/uart-16550" }
# The CMOS window and the same crate's plausible-year band: the first is the
# second `<ioport>` grant `sysdesc` compares, and the second is what
# `clock_contract` holds a booted node's own reported instant to.
lfw-rtc = { path = "../../crates/rtc" }
# The HPET grant's extent — a page rather than the register block, derived in
# the crate that owns the block for the reason every size constant above is
# reached for rather than written out.
lfw-hpet = { path = "../../crates/hpet" }
# The address arithmetic the bench is derived with: `prefix_mask`, and the
# parsers `forward_harness` decodes a management reply with. Writing either out
# here would make the harness agree with itself rather than with the appliance —
# the drift every dependency above exists to close.
net-headers = { path = "../../crates/net-headers" }
# The band a derived counter frequency has to be inside, for `clock_contract`.
# `lfw-log` already pulls this in transitively; a transitive dependency is not
# a name this crate may use, and writing the two numbers out here is the drift
# every dependency above exists to close.
lfw-clock = { path = "../../crates/clock" }
# The stats region's extent, and — for the curl scenario's cross-check — the
# metric names the appliance's own catalogue declares. Restating either here
# would let the harness agree with itself: the whole point of that scenario is a
# metric compared against traffic the harness observed independently.
lfw-metrics = { path = "../../crates/metrics" }
# The status codes and the content type the management server answers with, so
# the curl scenario compares fields against the appliance's own vocabulary
# rather than against literals beside it.
lfw-http = { path = "../../crates/http" }
# The connection table's capacity, which the metrics scenario sums the occupancy
# gauge against. A literal here would let the harness agree with itself about a
# number the appliance is the only source of.
lfw-flow = { path = "../../crates/flow" }
# The block driver's three region extents, which `sysdesc` compares the
# recorder's grants against, and — for the QEMU harness — the sector and the
# pattern its boot-time proof commits to the data disk. The harness reads that
# sector back and compares it byte for byte against `lfw_blk::smoke`'s own
# definition, so the appliance and the thing judging it cannot come to disagree
# about what was written: the drift every dependency above exists to close.
lfw-blk = { path = "../../crates/blk" }
# Where each recording lives on the medium and how much of a frame it keeps.
# `data_disk` reads those extents straight off the disk image after a run and
# `recording_contract` judges a downloaded body against the same snap lengths,
# so the appliance's placement and the thing judging it are one statement.
lfw-recorder = { path = "../../crates/recorder" }
# The state record's magic and version, for the one thing the host may say about
# the store medium without reading what it holds. Those two fields are the only
# ones on that medium that are neither the appliance's secret nor derived from
# it, and reaching for the constants rather than restating them is what keeps
# this check and the writer one fact.
lfw-store = { path = "../../crates/store" }
# The two rendered widths the certificate profile defines, for the console
# contract that holds the store domain's records to them. Reached for rather than
# restated: an administrator compares two renderings character for character, and
# a copy of a width here would be the second rendering the profile refuses.
lfw-x509 = { path = "../../crates/x509" }
# The superblock the recorder writes at the head of each extent, decoded off
# the disk image with the appliance's own decoder rather than a copy of it.
lfw-capture-ring = { path = "../../crates/capture-ring" }
# The onboarding package's own format and vocabulary, for the harness that
# plays the management server: the four member names, the block size, and the
# token each refusal is named by. Composing a package here against a second
# copy of that format — or asserting a token written out beside the code that
# raises it — is the drift every dependency above exists to close, and it would
# hide in exactly the place a passing gate looks like proof.
lfw-package = { path = "../../crates/package" }

[lints]
workspace = true
