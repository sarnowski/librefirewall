[package]
name = "librefirewall-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

# A standalone workspace: the fuzz crate is deliberately NOT a member of the
# main workspace, so its libFuzzer/ASan build settings and its dependency tree
# (libfuzzer-sys and its bundled runtime) never affect the `no_std` PD builds.
[workspace]

# Every workspace crate that parses or interprets bytes it did not write is a
# dependency here, and each has a target below. That is the reviewable form of
# that obligation: this list is diffed against `crates/` whenever a crate is
# added, and a crate on an untrusted-input path without an entry is a finding.
#
#   wire            the descriptor ABI, the config handover image and the log
#                   record and ring a peer PD writes
#   lfw-log         the event a peer PD's log record decodes to, and the console
#                   line it renders to — which since the record gained a
#                   measured clock reaches `lfw-clock`'s calendar with a peer's
#                   own `u64` of nanoseconds, so that crate is on this surface
#                   through this one and needs no target of its own
#   config          the configuration document, whose every byte is the
#                   management-plane attacker's, and the model read out of it
#   net-headers     the Ethernet/IPv4/UDP/TCP/ICMP/ARP headers a wire carries
#   lfw-ip-endpoint the terminal endpoint that answers ARP, ICMP echo and TCP for
#                   the management port, and so the first surface here that
#                   composes a reply out of an adversary's own bytes
#   lfw-tcp         the transport that carries a connection on that port: every
#                   segment field, every option, and the state machine over them
#   lfw-flow        the connection table those segments move the state of, and
#                   the ICMP error whose quoted five-tuple is an attacker's own
#                   bytes deciding which flow a packet is related to
#   lfw-http        the request head a management-plane attacker composes, cut
#                   into whatever segments it chooses
#   lfw-onboarding  the request surface an unprovisioned appliance serves: the
#                   plaintext stream a peer sends over the onboarding session,
#                   cut into whatever deliveries it chooses, and the body of an
#                   upload handed on as it arrives
#   lfw-package     the onboarding package an administrator uploads: the tar
#                   framing, the armour around the two certificates, the DER
#                   walk that finds the key one binds, and the endpoint line —
#                   every byte of which is the management-plane attacker's
#   lfw-tls         the onboarding TLS server: every record an unauthenticated
#                   peer sends, the buffering either side of the adopted
#                   library, and the outcome the handshake settles on — and
#                   with it `lfw-crypto`, whose key exchange and signature
#                   verification take a peer's own bytes through that server,
#                   so that crate is on this surface through this one and
#                   needs no target of its own
#   lfw-metrics     the exposition rendered out of counters a peer PD wrote, into
#                   storage of whatever size the endpoint has — and the metric
#                   reading a recording carries, whose decode side reads bytes
#                   out of a file that left a customer's premises
#   routing         the forwarding table those headers are resolved against
#   pipeline        the chain of stages that turns them into a verdict
#   queue           the shared ring whose cursors and slots a peer PD owns
#   packet-buffer   the ownership ledger a peer PD's buffer returns cross
#   virtio          the device's PCI config space and virtqueue
#   pd-runtime      the inter-PD pool-ownership protocol
#   nic-driver-core the driver paths facing both the device and the peer
#   lfw-recorder    the recording pass and the sink under it, where the tap's
#                   annotations, a download's offset and the medium's
#                   completions all meet
#   lfw-capture-ring the superblock read back off that medium, and the ring a
#                   decoded one is resumed into
#   lfw-store       the appliance's own state record, whose every byte is a
#                   PHYSICAL attacker's: not merely chosen by one, but composed
#                   offline with this decoder's source in hand — and, on its
#                   install path, an uploaded archive in a region a peer PD
#                   writes together with the length that peer claims about it
#   lfw-pcapng      the block encoders those two write through: a frame's
#                   length on the wire and an annotation's bytes are the
#                   network's and a peer's, and both become a length field
#   lfw-channel     the management channel's framing: every header, every stated
#                   length and every payload field a management server composes,
#                   arriving in whatever pieces it chooses
[dependencies]
libfuzzer-sys = "0.4.9"
arbitrary = "1.4.1"
wire = { path = "../crates/wire" }
lfw-log = { path = "../crates/log" }
config = { path = "../crates/config" }
net-headers = { path = "../crates/net-headers" }
lfw-ip-endpoint = { path = "../crates/ip-endpoint" }
lfw-tcp = { path = "../crates/tcp" }
lfw-flow = { path = "../crates/flow" }
lfw-http = { path = "../crates/http" }
lfw-metrics = { path = "../crates/metrics" }
lfw-clock = { path = "../crates/clock" }
routing = { path = "../crates/routing" }
pipeline = { path = "../crates/pipeline" }
queue = { path = "../crates/queue" }
packet-buffer = { path = "../crates/packet-buffer" }
virtio = { path = "../crates/virtio" }
pd-runtime = { path = "../crates/pd-runtime" }
nic-driver-core = { path = "../crates/nic-driver-core" }
# The block device class: every byte it reads is a device's, so it is owed
# a target — the used-ring index decides which slot's status byte is read.
lfw-blk = { path = "../crates/blk" }
# The recording pass and the ring under it: the tap's annotations, a download's
# offset and a superblock read back off the medium are all somebody else's
# bytes, so both are owed a target.
lfw-recorder = { path = "../crates/recorder" }
lfw-capture-ring = { path = "../crates/capture-ring" }
# The encoder those two write through. It parses nothing, which is why it was
# once left off this list — but a target is owed by a crate that *interprets*
# bytes it did not write, and this one interprets two: the frame length the wire
# stated and the annotation bytes a peer PD chose, both of which become a length
# field and a padding run. A length that steered a write here would be a write
# to a block device from the one domain holding its capability, so it gets a
# target of its own rather than being reached incidentally through the pass.
lfw-pcapng = { path = "../crates/pcapng" }
# The appliance's own persistent state. It is on this list for the strongest
# reason any crate here is: the bytes are not merely an adversary's, they were
# written by somebody holding the disk, at leisure, and the identity decoded out
# of them is what the appliance signs with.
lfw-store = { path = "../crates/store" }
lfw-tls = { path = "../crates/tls" }
# The framing above that record layer. Its whole input is a management server's
# byte stream and the pacing of it, and the frame it reassembles is the largest
# object this appliance takes from a peer it has authenticated.
lfw-channel = { path = "../crates/channel" }
# The onboarding package reader. Its whole surface is a byte string an
# unauthenticated peer uploaded, and it reaches `config` underneath, so the
# target here drives one parser through another.
lfw-package = { path = "../crates/package" }
# The surface above the record layer. Its whole input is a peer's plaintext and
# the pacing of it, and the body it hands on is the largest object this appliance
# takes from an unauthenticated party.
lfw-onboarding = { path = "../crates/onboarding" }
lfw-crypto = { path = "../crates/crypto" }
# The `SubjectPublicKeyInfo` a fingerprint is taken over, so the harness can hold
# a verified identity's fingerprint to the digest over its own stored key rather
# than to whatever the verification answered.
lfw-x509 = { path = "../crates/x509" }

# This workspace is standalone, so the root workspace's `[workspace.lints]` does
# not reach it and its lint policy has to be stated here. `unused_must_use` is
# the one that earned its place: in a harness a refusal *is* the finding — the
# opposite of the dataplane's drop-and-count choice — so a dropped `#[must_use]`
# rejection must not compile. `missing_docs` is deliberately absent, matching
# the root workspace, which also leaves `missing_docs` unenforced.
#
# These are enforced by the gate through `cargo test --locked --lib` in this
# directory (`xtask fuzz` runs it first), which compiles the harness library.
[lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# The harness bodies live in a small library so the same code is exercised both
# by the libFuzzer binaries below and by the seed-corpus smoke tests (run with
# `cargo test --lib`) where the sandbox cannot execute libFuzzer.
[lib]
path = "src/lib.rs"

