[package]
# The program image the system description names is `store.elf`. Built with the
# hardfloat, SSE-enabled target specification
# (support/targets/x86_64-sel4-simd.json) rather than the softfloat minimal one
# every dataplane domain uses, for the reason the cryptography domain is: the
# P-256 and SHA-256 backends this domain's identity work selects are
# compile-time choices of that specification, and a device key generated through
# the portable fallback would be a key generated by code no boot ever proved.
name = "store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sel4-microkit.workspace = true
lfw-blk = { path = "../../crates/blk" }
lfw-crypto = { path = "../../crates/crypto" }
lfw-log = { path = "../../crates/log" }
lfw-metrics = { path = "../../crates/metrics" }
# The onboarding package's own refusal tree, so a console token names the rule
# the contract states rather than a class of them. The reading itself is
# `lfw-store`'s; what is reached for here is the vocabulary of the answer.
lfw-package = { path = "../../crates/package" }
lfw-store = { path = "../../crates/store" }
pd-runtime = { path = "../../crates/pd-runtime" }
virtio = { path = "../../crates/virtio" }
wire = { path = "../../crates/wire" }

[lints]
workspace = true
