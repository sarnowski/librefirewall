[package]
# The program image the system description names is `crypto.elf`. Built with
# the hardfloat, SSE-enabled target specification
# (support/targets/x86_64-sel4-simd.json) rather than the softfloat minimal one
# every dataplane domain uses, because the AES-NI and carry-less-multiply
# backends its cryptography selects are compile-time choices of that
# specification.
name = "crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sel4-microkit.workspace = true
lfw-clock = { path = "../../crates/clock" }
lfw-crypto = { path = "../../crates/crypto" }
lfw-log = { path = "../../crates/log" }
lfw-metrics = { path = "../../crates/metrics" }
lfw-onboarding = { path = "../../crates/onboarding" }
lfw-tls = { path = "../../crates/tls" }
lfw-x509 = { path = "../../crates/x509" }
pd-runtime = { path = "../../crates/pd-runtime" }
wire = { path = "../../crates/wire" }

[lints]
workspace = true
