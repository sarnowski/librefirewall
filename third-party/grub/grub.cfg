# librefirewall A/B boot manager — immutable configuration.
#
# This file is embedded inside the signed grubx64.efi core image, so it is
# part of the verified boot base and never read from writable media. Because
# the core image carries the librefirewall public key, GRUB enforces detached
# signature verification on every file it subsequently loads (the seL4 kernel
# and the Microkit system image of the selected slot).
#
# Slot selection follows the OK/TRY/ORDER scheme: a slot marked *_OK boots
# immediately; an unconfirmed slot is tried exactly once (its *_TRY flag is set
# before handoff) and, if it never confirms health, the next slot in ORDER is
# used. No in-system component confirms health yet: the host harness seeds and
# inspects grubenv only to exercise the state machine. Production confirmation
# (setting *_OK after health is established) belongs to the future update/health
# PD. Stock GRUB scripting has no arithmetic, so a multi-attempt counter and a
# redundant generation log are deliberately out of scope here and belong to
# that later, writable-state owner; see CONCEPT.md.
#
# Two coupling constraints a reader must respect:
#  - The partitions are addressed as fixed (hd0,gptN): the boot disk must
#    enumerate as hd0. This holds on the QEMU machine (a single ide-hd) and is
#    why the module allowlist carries no `search*` module. A hardware appliance
#    with several disks/NVMe may enumerate differently; switching to
#    `search --fs-uuid` is the change that would relax this (and would then
#    justify re-adding the search modules to modules.txt).
#  - The `echo` lines below are load-bearing: the A/B system test asserts on
#    their exact text (tools/xtask/src/ab_test.rs). Change a message here and
#    the corresponding needle there in the same commit, or the boot test fails.

set timeout=0

set state=(hd0,gpt2)
set slot_a=(hd0,gpt3)
set slot_b=(hd0,gpt4)

# Defaults cover a blank or torn env block. The running configuration is
# whatever grubenv overrides on top of these.
set ORDER="A B"
set A_OK=0
set A_TRY=0
set B_OK=0
set B_TRY=0

# Boot-selection state only chooses among already-signed slots, so it is loaded
# unverified. It can never inject code.
load_env --skip-sig --file ${state}/grubenv ORDER A_OK A_TRY B_OK B_TRY

function boot_slot {
    # The seL4 kernel is the Multiboot2 image and the Microkit system image is
    # its boot module. Under Multiboot2 the kernel takes its serial console from
    # the command line (QEMU's builtin -kernel loader supplied this implicitly);
    # without console_port the debug kernel boots silently. The IOMMU is left
    # enabled (Microkit's x86 default) — on hardware without VT-d seL4 simply
    # reports zero IOMMUs.
    multiboot2 $1/librefirewall-kernel.elf console_port=0x3f8 debug_port=0x3f8
    module2 $1/librefirewall-system.img librefirewall-system
    boot
}

function attempt {
    # $1 slot letter, $2 *_OK, $3 *_TRY, $4 slot device
    if [ "$2" = "1" ]; then
        echo "librefirewall: booting confirmed slot $1"
        boot_slot "$4"
    elif [ "$3" = "0" ]; then
        echo "librefirewall: trying slot $1"
        set $1_TRY=1
        save_env --file ${state}/grubenv ORDER A_OK A_TRY B_OK B_TRY
        boot_slot "$4"
    fi
}

set primary=A
set secondary=B
if [ "${ORDER}" = "B A" ]; then
    set primary=B
    set secondary=A
fi

if [ "${primary}" = "A" ]; then
    attempt A "${A_OK}" "${A_TRY}" "${slot_a}"
    attempt B "${B_OK}" "${B_TRY}" "${slot_b}"
else
    attempt B "${B_OK}" "${B_TRY}" "${slot_b}"
    attempt A "${A_OK}" "${A_TRY}" "${slot_a}"
fi

echo "librefirewall: no bootable slot; A and B are both exhausted or unusable."
echo "System halted. Recovery is an external action."
halt
