# rustup 1.28.2 and the project toolchain.
#
# RUST_CHANNEL_MANIFEST_* pins the toolchain itself: rustup hash-verifies every
# component archive it downloads against this manifest, so pinning the manifest
# pins rustc, cargo, and every component without listing them. The builder
# fetches and checksums it before running rustup-init and refuses to proceed if
# the URL's date does not match RUST_TOOLCHAIN. Residual risk: rustup fetches
# its own copy rather than consuming the verified file, so this detects a
# silently republished nightly (the reproducibility failure that actually
# occurs) but leaves a seconds-wide window against an attacker who can already
# break TLS to static.rust-lang.org.
RUSTUP_INIT_URL=https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
RUSTUP_INIT_SHA256=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
RUST_TOOLCHAIN=nightly-2026-04-04
RUST_CHANNEL_MANIFEST_URL=https://static.rust-lang.org/dist/2026-04-04/channel-rust-nightly.toml
RUST_CHANNEL_MANIFEST_SHA256=e3d1de195a65aeaf1d34775d12f23713b7c154717b8582a3a24716a9fb9085a1

