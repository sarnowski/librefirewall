# Pinned Rust developer tools, built from crates.io into the builder image
# during its (network-enabled) build so the offline host gate can run them:
# coverage (cargo-llvm-cov), dependency/license policy (cargo-deny), and
# fuzzing (cargo-fuzz, used in a later phase).
#
# These carry a version but no sha256, unlike every other entry above, because
# `cargo install` offers no way to supply one. What stands in for it: the
# version is exact, `--locked` resolves the tool's entire dependency tree from
# its published lockfile, and cargo verifies each downloaded .crate against the
# checksum in the crates.io index it fetched over TLS. Residual risk: that
# checksum comes from the registry rather than from a value recorded here, so
# a compromised index could serve different content under the same version —
# unlike the sha256-pinned downloads above, which such an index could not
# affect. Closing it would mean fetching each .crate by hand, checksumming it,
# and installing from the unpacked path, trading a real increase in moving
# parts for that difference; the tools do not enter the deployed payload.
CARGO_LLVM_COV_VERSION=0.8.7
CARGO_DENY_VERSION=0.20.2
CARGO_FUZZ_VERSION=0.13.2
