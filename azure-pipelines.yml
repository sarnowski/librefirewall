trigger:
  branches:
    include:
      - trunk

pr:
  branches:
    include:
      - trunk

pool:
  # Azure's hosted images are rebuilt continuously and cannot be pinned by
  # digest, so this is the one build-critical input the repository does not
  # control. What limits the blast radius is that nothing shipped is produced
  # by the agent: every compiler, library, and tool that touches an artifact
  # lives in the digest-pinned builder image, and `make ci` runs it with
  # --network=none. The agent still contributes its container engine, and that
  # is not cosmetic — podman/buildah versions differ in build-context and
  # `COPY` semantics — so an agent-image bump that changes the produced payload
  # is possible and is what `make verify-reproducible` exists to catch.
  vmImage: ubuntu-24.04

jobs:
  - job: ci
    displayName: CI
    timeoutInMinutes: 90
    steps:
      - checkout: self

      # The only step permitted to reach the network on behalf of the build:
      # it provisions the pinned builder image and assembles the boot payload.
      # Every later step runs offline inside that image.
      - script: make image
        displayName: Provision pinned builder and assemble image

      # `release` rather than `ci`, and the difference is the half of the
      # published contract that `ci` alone does not carry: `ci` assembles
      # `dist/` partway through its run and leaves whatever it got there when it
      # fails, while `release` runs the identical gate — it boots nothing of its
      # own — and empties `dist/` when the gate did not prove what it holds. Run
      # as `ci`, that emptying is documented behaviour that never once applies to
      # a CI run, and the artifact's qualification rests entirely on the publish
      # condition below.
      - script: make release
        displayName: Run CI gate and qualify dist/ (offline)

      # `cargo deny check advisories` must fetch the RustSec database, which
      # the offline gate cannot do — so vulnerability scanning lives here, and
      # only here. It runs in the same pinned builder (with the network left
      # on) rather than as its own job, because a separate Azure job gets a
      # fresh agent and would rebuild the whole builder image to run one check.
      # `succeededOrFailed` keeps it independent of the gate's outcome: a newly
      # published advisory must surface even on a red build.
      - script: |
          set -eu
          . third-party/sources.lock
          podman --cgroup-manager=cgroupfs run --rm \
            --read-only \
            --cap-drop=all \
            --security-opt=no-new-privileges \
            --userns=keep-id \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --tmpfs /tmp:rw,nosuid,nodev \
            --mount type=bind,src="$PWD",dst=/workspace,rw=true \
            "localhost/librefirewall-builder:microkit-${MICROKIT_VERSION}" \
            cargo deny check advisories
        displayName: Scan dependencies for advisories (networked)
        condition: succeededOrFailed()

      # Explicitly gated on the job, and deliberately NOT the
      # `succeededOrFailed` of the step above: an artifact published after a red
      # gate is an unproven image wearing the appearance of a finished one, and
      # `dist/` is exactly what the gate exists to qualify. The
      # condition restates the default so that copying the neighbouring step's
      # condition is a visible change rather than an invisible one.
      #
      # Since the gate step runs `make release`, a red gate has already emptied
      # `dist/` and this condition is the second of two independent reasons
      # nothing unproven is published, rather than the only one.
      - task: PublishPipelineArtifact@1
        displayName: Publish distribution artifacts
        condition: succeeded()
        inputs:
          targetPath: dist
          artifact: dist
